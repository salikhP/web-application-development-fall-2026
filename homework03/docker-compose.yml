services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docktrace}
      POSTGRES_USER: ${POSTGRES_USER:-docktrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-18083}:8080"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docktrace}
      POSTGRES_USER: ${POSTGRES_USER:-docktrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
